group = 'chimin.remindme.google_account'
version = '1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20' }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'chimin.remindme.google_account'
    compileSdk 36
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
repositories { google(); mavenCentral() }
dependencies { implementation 'com.google.android.gms:play-services-auth:21.5.1' }
