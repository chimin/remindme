name: Build

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g., 1.0.0+1 or just 1.0.0)'
        required: true
        type: string
      build_apk:
        description: 'Build APK'
        required: false
        type: boolean
        default: true
      build_aab:
        description: 'Build AAB bundle'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            # GitHub tag filters are globs; enforce the exact format here.
            if ($env:TAG_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "Release tags must have the format v1.2.3."
            }
            $versionName = $env:TAG_NAME.Substring(1)
            $parts = $versionName.Split('.')
            $major = [long]$parts[0]
            $minor = [long]$parts[1]
            $patch = [long]$parts[2]
            $versionCode = $major * 1000000 + $minor * 1000 + $patch
            if ($minor -gt 999 -or $patch -gt 999 -or $versionCode -lt 1 -or $versionCode -gt 2100000000) {
              throw "Tag version must produce a Play version code from 1 to 2100000000; minor and patch must be at most 999."
            }
            $appVersion = "${versionName}+${versionCode}"
          } else {
            $appVersion = $env:APP_VERSION
            if ($appVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[1-9][0-9]*)?$') {
              throw "App version must have the format 1.2.3 or 1.2.3+4."
            }
          }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          $pubspec = Get-Content pubspec.yaml -Raw
          Set-Content pubspec.yaml ($pubspec -replace '(?m)^version: .*$', "version: $appVersion") -NoNewline

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore build configuration and signing key
        shell: pwsh
        env:
          BUILD_KEYSTORE_BASE64: ${{ secrets.BUILD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          foreach ($name in @('GOOGLE_WEB_CLIENT_ID', 'BUILD_KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required secret $name is missing."
            }
          }
          if ('${{ github.event_name }}' -eq 'push' -and [string]::IsNullOrWhiteSpace($env:GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)) {
            throw "Required secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."
          }
          New-Item -ItemType Directory -Force secrets | Out-Null
          @{ GOOGLE_WEB_CLIENT_ID = $env:GOOGLE_WEB_CLIENT_ID } | ConvertTo-Json | Set-Content secrets/build.json
          [IO.File]::WriteAllBytes('secrets/build.keystore', [Convert]::FromBase64String($env:BUILD_KEYSTORE_BASE64))

      - name: Build APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        run: flutter build apk --release --dart-define-from-file=secrets/build.json

      - name: Upload APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: remindme-apk-${{ steps.version.outputs.app_version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build AAB
        if: ${{ github.event_name == 'push' || inputs.build_aab }}
        run: flutter build appbundle --release --dart-define-from-file=secrets/build.json

      - name: Upload AAB artifact
        if: ${{ github.event_name == 'push' || inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: remindme-aab-${{ steps.version.outputs.app_version }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Google Play
        if: ${{ github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: chimin.remindme
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          status: completed

      - name: Clean up signing files
        if: ${{ always() }}
        shell: pwsh
        run: |
          Remove-Item -LiteralPath secrets/build.keystore, secrets/build.json -Force -ErrorAction SilentlyContinue
